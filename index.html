<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Roleplay Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f0f2f5; --header:#1b1f3a; --card:#fff;
  --muted:#777; --accent:#ff6b6b; --accent2:#4ecca3;
  --radius:12px; --shadow:0 12px 25px rgba(0,0,0,0.15);
  font-family:'Inter',sans-serif;
}
body{margin:0;background:var(--bg);color:#333;}
header{background:var(--header);color:#fff;padding:20px;text-align:center;font-size:24px;font-weight:700;}
.app{max-width:1200px;margin:20px auto;padding:10px;}
.btn{background:var(--accent2);color:#fff;padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:0.2s;}
.btn:hover{opacity:0.85;}
.rooms-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px;}
.room{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:0.3s;}
.room:hover{transform:translateY(-5px);}
.room img{width:100%;height:180px;object-fit:cover;}
.room-info{padding:15px;}
.room-info h3{margin:0 0 8px 0;}
.room-info .meta{color:var(--muted);}
.sold-out{position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;padding:4px 8px;border-radius:6px;font-weight:700;}
.room-detail{display:none;background:var(--card);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);margin-top:20px;}
.room-detail h2{margin-bottom:15px;}
.room-detail img{max-width:100%;border-radius:12px;margin-bottom:10px;}
.room-detail form{display:flex;flex-direction:column;gap:10px;}
.room-detail input, .room-detail button{padding:10px;border-radius:8px;border:1px solid #ccc;}
.room-detail button{background:var(--accent2);color:#fff;border:none;cursor:pointer;font-weight:600;}
#calendar{display:flex;gap:5px;flex-wrap:wrap;}
#calendar div{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;}
#calendar .selected{background:var(--accent2);color:#fff;}
#calendar .in-range{background:var(--accent2);opacity:0.5;color:#fff;}
#hostView{display:none;background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);margin-top:20px;}
#chatBox{display:none;background:var(--card);padding:10px;border-radius:12px;box-shadow:var(--shadow);margin-top:20px;}
#messages{height:200px;overflow-y:scroll;border:1px solid #ccc;padding:10px;margin-bottom:10px;}
#messages p{margin:4px 0;}
.host-msg{color:var(--accent2);}
.buyer-msg{color:var(--accent);}
#clearChatBtn{margin-top:5px;}
</style>
</head>
<body>
<header>Grand Roleplay Hotel</header>
<div class="app">
<div id="roleSelect">
  <h2>Welcome! Are you a Host or Buyer?</h2>
  <button class="btn" id="beHost">Host</button>
  <button class="btn" id="beBuyer">Buyer</button>
</div>

<div id="buyerView">
  <h2>Available Rooms</h2>
  <div class="rooms-grid" id="roomsGrid"></div>
</div>

<div id="roomDetail" class="room-detail">
  <h2 id="roomTitle"></h2>
  <img id="roomImg">
  <p id="roomMeta"></p>
  <form id="bookingForm">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <div id="calendar"></div>
    <button type="submit">Book Now</button>
  </form>
</div>

<div id="hostView"></div>

<div id="chatBox">
  <h2>Customer Service Chat</h2>
  <div id="messages"></div>
  <input type="text" id="chatInput" placeholder="Type message">
  <button id="sendChatBtn">Send</button>
  <button id="clearChatBtn" style="display:none;background:#ff6b6b;color:#fff;">Clear Chat</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9uzP781-TlDSC9fILQX8M-Xa7Ely_rZc",
  authDomain: "chayt-41951.firebaseapp.com",
  projectId: "chayt-41951",
  storageBucket: "chayt-41951.appspot.com",
  messagingSenderId: "841659925542",
  appId: "1:841659925542:web:ba7751ee2a97b5fcf452e7",
  databaseURL: "https://chayt-41951-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let role=null;
const roleSelect = document.getElementById('roleSelect');
const buyerView = document.getElementById('buyerView');
const hostView = document.getElementById('hostView');
const roomsGrid = document.getElementById('roomsGrid');
const roomDetail = document.getElementById('roomDetail');
const chatBox = document.getElementById('chatBox');
const messagesDiv = document.getElementById('messages');
const chatInput = document.getElementById('chatInput');
const sendChatBtn = document.getElementById('sendChatBtn');
const roomTitle = document.getElementById('roomTitle');
const roomImg = document.getElementById('roomImg');
const roomMeta = document.getElementById('roomMeta');
const bookingForm = document.getElementById('bookingForm');
const calendarDiv = document.getElementById('calendar');
const clearChatBtn = document.getElementById('clearChatBtn');

const ROOMS = [
  {id:'yugs-room', title:"Yugs Room", price:120, beds:1, images:["https://i.imgur.com/wsz2cpV.jpg"]},
  {id:'nairas-room', title:"Naira's Room", price:95, beds:1, images:["https://i.imgur.com/2c61qDa.jpg"]},
  {id:'hirens-room', title:"Hirens Room", price:160, beds:2, soldOut:true},
  {id:'ayans-room', title:"Ayans Room", price:140, beds:1, images:["https://i.imgur.com/DA0ME6b.jpg"]}
];

let selectedRoom=null;
let startDate=null, endDate=null;

document.getElementById('beHost').onclick=()=>switchRole('host');
document.getElementById('beBuyer').onclick=()=>switchRole('buyer');

function switchRole(r){
  role=r;
  roleSelect.style.display='none';
  if(role==='host'){ 
    hostView.style.display='block'; 
    buyerView.style.display='none'; 
    renderHostApplications(); 
    chatBox.style.display='block';
    clearChatBtn.style.display='inline-block';
  }
  if(role==='buyer'){ 
    buyerView.style.display='block'; 
    hostView.style.display='none'; 
    renderRooms(); 
    chatBox.style.display='block';
    clearChatBtn.style.display='none';
  }
}

function renderRooms(){
  roomsGrid.innerHTML='';
  ROOMS.forEach(room=>{
    const div=document.createElement('div');
    div.className='room';
    div.innerHTML=`<img src="${room.images?room.images[0]:'https://via.placeholder.com/150'}">
                   <div class="room-info"><h3>${room.title}</h3>
                   <div class="meta">Price: $${room.price} • Beds: ${room.beds}</div></div>`;
    if(room.soldOut){ div.innerHTML+='<div class="sold-out">❌ Sold Out</div>'; div.style.cursor='default'; }
    else div.onclick=()=>openRoomDetail(room);
    roomsGrid.appendChild(div);
  });
}

function openRoomDetail(room){
  selectedRoom=room;
  roomTitle.textContent = room.title;
  roomImg.src = room.images[0];
  roomMeta.textContent = `Price: $${room.price} | Beds: ${room.beds}`;
  roomDetail.style.display='block';
  renderCalendar();
}

// Calendar
function renderCalendar(){
  calendarDiv.innerHTML='';
  const year=2025, month=9; // October 2025
  const daysInMonth = 31;
  for(let i=1;i<=daysInMonth;i++){
    const dayDiv=document.createElement('div');
    dayDiv.textContent=i;
    dayDiv.onclick=()=>selectDate(i);
    if(i===18) startDate=18; // initial start date
    calendarDiv.appendChild(dayDiv);
  }
  updateCalendarUI();
}

function selectDate(day){
  if(!startDate){ startDate=day; endDate=null; }
  else if(!endDate && day>=startDate) endDate=day;
  else{ startDate=day; endDate=null; }
  updateCalendarUI();
}

function updateCalendarUI(){
  Array.from(calendarDiv.children).forEach(div=>{
    div.classList.remove('selected','in-range');
    const d=parseInt(div.textContent);
    if(d===startDate || d===endDate) div.classList.add('selected');
    if(startDate && endDate && d>startDate && d<endDate) div.classList.add('in-range');
  });
}

// Booking submit
bookingForm.onsubmit=function(e){
  e.preventDefault();
  if(!startDate || !endDate){ alert("Select start and end date!"); return; }
  const form=this;
  const booking={
    roomId:selectedRoom.id,
    name:form.name.value,
    email:form.email.value,
    start:`2025-10-${startDate.toString().padStart(2,'0')}`,
    end:`2025-10-${endDate.toString().padStart(2,'0')}`,
    status:'pending',
    timestamp:Date.now()
  };
  db.ref('bookings').push(booking);
  alert("Application sent! Host will see it in realtime.");
  form.reset();
  startDate=endDate=null;
  updateCalendarUI();
}

// Host dashboard
function renderHostApplications(){
  hostView.innerHTML='<h2>Host Dashboard</h2>';
  db.ref('bookings').on('value', snapshot=>{
    hostView.innerHTML='<h2>Host Dashboard</h2>';
    snapshot.forEach(child=>{
      const booking = child.val();
      const id = child.key;
      const div = document.createElement('div');
      div.style.marginBottom='10px';
      div.innerHTML=`<p>${booking.name} applied for ${booking.roomId} (${booking.start} → ${booking.end}) - Status: ${booking.status}</p>
      <button onclick="updateBookingStatus('${id}','accepted')">Accept</button>
      <button onclick="updateBookingStatus('${id}','declined')">Decline</button>`;
      hostView.appendChild(div);
    });
  });
}

function updateBookingStatus(id,status){
  db.ref('bookings/'+id).update({status});
}

// Chat
sendChatBtn.onclick = ()=>{
  const msg = chatInput.value.trim();
  if(!msg) return;
  db.ref('chat').push({user:role, message:msg, timestamp:Date.now()});
  chatInput.value='';
};

db.ref('chat').on('value', snapshot=>{
  messagesDiv.innerHTML='';
  snapshot.forEach(child=>{
    const msg = child.val();
    const p = document.createElement('p');
    p.innerHTML=`<strong>${msg.user}:</strong> ${msg.message}`;
    p.className = msg.user==='host'?'host-msg':'buyer-msg';
    messagesDiv.appendChild(p);
  });
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
});

// Clear chat
clearChatBtn.onclick = ()=>{
  if(confirm("Are you sure you want to clear the chat?")){
    db.ref('chat').remove();
  }
};
</script>
</body>
</html>
